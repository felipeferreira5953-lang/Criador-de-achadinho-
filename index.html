<script>
const $aff=document.getElementById('aff');

let ORIGINAL="";

function log(t){const $log=document.getElementById('log');const d=document.createElement('div');d.textContent=new Date().toLocaleTimeString()+" → "+t;$log.appendChild(d);$log.scrollTop=$log.scrollHeight;}
function extractIds(u){const m=u.match(/-i\.(\d+)\.(\d+)/);return m?{shop:m[1],item:m[2]}:null;}
async function fetchTimeout(url, ms=3500){const c=new AbortController();const id=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});clearTimeout(id);if(!r.ok) return null;return await r.text();}catch(e){clearTimeout(id);return null;}}
function extractPricesFromHTML(html){
 const results={precos:[], priceAmount:null, priceMin:null, priceBefore:null};
 if(!html) return results;
 let m=html.match(/<meta property="product:price:amount" content="([^"]+)"/); if(m) results.priceAmount=parseFloat(m[1]);
 let matches=[...html.matchAll(/"price_min"\s*:\s*(\d+)/g)]; if(matches.length) results.priceMin=Math.max(...matches.map(x=>parseInt(x[1])));
 let matchesBefore=[...html.matchAll(/"price_min_before_discount"\s*:\s*(\d+)/g)]; if(matchesBefore.length) results.priceBefore=Math.max(...matchesBefore.map(x=>parseInt(x[1])));
 let reais=[...html.matchAll(/R\$\s*([\d\.\,]+)/g)]; reais.forEach(r=>{let txt=r[1].replace(/\./g,'').replace(',','.'); let val=parseFloat(txt); if(val>=5 && val<=20000) results.precos.push(val);});
 results.precos.sort((a,b)=>a-b);
 return results;
}
function parseShopeeIntPrice(v){if(!v) return null; if(v>=10000000) return v/100000; if(v>=100000) return v/100000; if(v>=1000) return v/100; return v;}
async function resolveTurbo(shortUrl){
 if(cache[shortUrl]?.finalUrl) {log(`⚡ Cache`); return cache[shortUrl];}
 const proxies=[`https://api.allorigins.win/get?url=${encodeURIComponent(shortUrl)}`,`https://corsproxy.io/?${encodeURIComponent(shortUrl)}`];
 const promises=proxies.map(async p=>{const txt=await fetchTimeout(p,3000); if(!txt) return null; let finalM=txt.match(/https:\/\/shopee\.com\.br\/[^"'\s<>]+-i\.\d+\.\d+/); if(finalM) return {finalUrl:finalM[0], html:txt}; let m=txt.match(/-i\.(\d+)\.(\d+)/); if(m) return {finalUrl:`https://shopee.com.br/produto-i.${m[1]}.${m[2]}`, html:txt, shop:m[1], item:m[2]}; try{const j=JSON.parse(txt);if(j.contents){let fm=j.contents.match(/https:\/\/shopee\.com\.br\/[^"'\s<>]+-i\.\d+\.\d+/); if(fm) return {finalUrl:fm[0], html:j.contents}; let mm=j.contents.match(/-i\.(\d+)\.(\d+)/); if(mm) return {finalUrl:`https://shopee.com.br/produto-i.${mm[1]}.${mm[2]}`, html:j.contents, shop:mm[1], item:mm[2]};}}catch(e){} return null;});
 const results=await Promise.allSettled(promises); for(let r of results){if(r.status==='fulfilled' && r.value?.finalUrl){cache[shortUrl]=r.value;localStorage.setItem('shopee_cache_v3',JSON.stringify(cache));return r.value;}} return {finalUrl:shortUrl, html:''};
}
function formatBRL(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}

document.getElementById('btn').onclick=async()=>{
 ORIGINAL=$aff.value.trim(); if(!ORIGINAL){alert('Cole seu s.shopee');return;}
 document.getElementById('result').classList.remove('hidden'); document.getElementById('log').innerHTML=""; log(`Link fiel: ${ORIGINAL}`);
 document.getElementById('msg').textContent=`⏳ Buscando valor real...`;
 (async()=>{
  const resolved=await resolveTurbo(ORIGINAL);
  let finalUrl=resolved.finalUrl; let htmlLong=resolved.html||''; let ids=extractIds(finalUrl) || (resolved.shop?{shop:resolved.shop,item:resolved.item}:null);
  let titulo="Produto Shopee Verificado", imagem=null; let precoAtual=null, precoAntes=null, desconto=0;

  if(finalUrl && finalUrl!==ORIGINAL){
   const htmlProd=await fetchTimeout(`https://api.allorigins.win/get?url=${encodeURIComponent(finalUrl)}`,4000);
   if(htmlProd){try{const j=JSON.parse(htmlProd);htmlLong=j.contents||htmlProd;}catch(e){htmlLong=htmlProd;}}
  }else if(!htmlLong){
   const htmlShort=await fetchTimeout(`https://api.allorigins.win/get?url=${encodeURIComponent(ORIGINAL)}`,4000);
   if(htmlShort){try{const j=JSON.parse(htmlShort);htmlLong=j.contents||htmlShort;}catch(e){htmlLong=htmlShort;}}
  }

  if(htmlLong){
   let mt=htmlLong.match(/<meta property="og:title" content="([^"]+)"/); let mi=htmlLong.match(/<meta property="og:image" content="([^"]+)"/);
   if(mt) titulo=mt[1]; if(mi) imagem=mi[1];
   let prices=extractPricesFromHTML(htmlLong);
   if(prices.priceAmount) precoAtual=prices.priceAmount;
   if(prices.priceMin) precoAtual=parseShopeeIntPrice(prices.priceMin);
   if(prices.priceBefore) precoAntes=parseShopeeIntPrice(prices.priceBefore);
   if(!precoAtual && prices.precos.length>0){precoAtual=prices.precos[0]; if(prices.precos.length>1) precoAntes=prices.precos[1]>precoAtual?prices.precos[1]:null;}
  }

  if(ids && (!precoAtual || precoAtual<5)){
   const apiUrl=`https://shopee.com.br/api/v4/item/get?itemid=${ids.item}&shopid=${ids.shop}`;
   const apiTxt=await fetchTimeout(`https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`,4000);
   if(apiTxt){try{const j=JSON.parse(apiTxt); if(j.data){titulo=j.data.name||titulo; const imgFile=j.data.image||(j.data.images&&j.data.images[0]); if(imgFile) imagem=`https://down-br.img.susercontent.com/file/${imgFile}`; let pMin=j.data.price_min||j.data.price; let pBefore=j.data.price_min_before_discount||j.data.price_before_discount; if(pMin) precoAtual=parseShopeeIntPrice(pMin); if(pBefore) precoAntes=parseShopeeIntPrice(pBefore);}}catch(e){}}
  }

  if((!precoAtual || precoAtual<5) && $manualPreco.value){let v=$manualPreco.value.replace(',','.').replace('R$','').trim(); precoAtual=parseFloat(v);}
  if(!precoAntes && $manualAntes.value){let v=$manualAntes.value.replace(',','.').replace('R$','').trim(); precoAntes=parseFloat(v);}
  if(precoAntes && precoAtual && precoAntes>precoAtual) desconto=Math.round((1-precoAtual/precoAntes)*100);

  const fotoReal=document.getElementById('fotoReal'); const fotoLoad=document.getElementById('fotoLoad'); const overlay=document.getElementById('priceOverlay');
  if(imagem){fotoReal.src=`https://images.weserv.nl/?url=${encodeURIComponent(imagem)}&w=600&h=600`; fotoReal.onload=()=>{fotoLoad.classList.add('hidden');overlay.classList.remove('hidden');}; fotoReal.onerror=()=>{fotoReal.src=imagem;fotoLoad.classList.add('hidden');overlay.classList.remove('hidden');};} else {fotoLoad.innerHTML=`<div class="p-4 text-center"><p class="font-black">${titulo.slice(0,50)}</p></div>`;}
  document.getElementById('oTitle').textContent=titulo.slice(0,55);
  if(precoAtual){if(precoAntes && desconto>0){document.getElementById('oPrice').textContent=`DE ${formatBRL(precoAntes)} POR ${formatBRL(precoAtual)}`;}else{document.getElementById('oPrice').textContent=`${formatBRL(precoAtual)}`;}}

  // MENSAGEM FINAL SEM NENHUMA HASHTAG - como pediu
  let blocoPreco="",blocoDesc="";
  if(precoAtual){
   if(precoAntes && desconto>0){
    blocoPreco=`💰 DE: ~${formatBRL(precoAntes)}~ POR: ${formatBRL(precoAtual)}`;
    blocoDesc=`🔥 ${desconto}% OFF - Economize ${formatBRL(precoAntes-precoAtual)}!`;
   }else{

   }

   blocoPreco=`💰 OFERTA IMPERDÍVEL`;
  }

  const msg=`🚨 QUEIMA DE ESTOQUE SHOPEE 🚨

📦 ${titulo.toUpperCase()}

${blocoPreco}
${blocoDesc}

⚡ PRODUTO VERIFICADO - Estoque limitado!
👇 LINK COM DESCONTO ATIVO 👇

${ORIGINAL}

⏰ Corre antes que o preço volte!`;

  document.getElementById('msg').textContent=msg;
  document.getElementById('info').innerHTML=`<b>Valor:</b> ${precoAtual?formatBRL(precoAtual):'manual'} | <b>Antes:</b> ${precoAntes?formatBRL(precoAntes):'-'} | <b>Desconto:</b> ${desconto}%<br><span class="text-green-700 font-bold">🔒 Link 100% fiel: ${ORIGINAL}</span><br><span class="text-[9px] text-gray-500">Sem hashtags, como pediu</span>`;

 })();
};

</script>
