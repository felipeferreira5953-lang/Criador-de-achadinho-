<script>
let ORIGINAL="";
function log(t){const $log=document.getElementById('log');const d=document.createElement('div');d.textContent=new Date().toLocaleTimeString()+" → "+t;$log.appendChild(d);$log.scrollTop=$log.scrollHeight;}
function formatBRL(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}

async function fetchWithTimeout(url, ms=7000){
 const c=new AbortController();const to=setTimeout(()=>c.abort(),ms);
 try{const r=await fetch(url,{signal:c.signal});clearTimeout(to);if(!r.ok) return null;return await r.text();}catch(e){clearTimeout(to);return null;}
}

async function resolveShopee(shortUrl){
 log(`🔍 Resolvendo ${shortUrl}...`);
 // 1. Tenta Microlink (preview WhatsApp) - funciona no celular
 try{
  let txt=await fetchWithTimeout(`https://api.microlink.io/?url=${encodeURIComponent(shortUrl)}`, 6000);
  if(txt){
   let j=JSON.parse(txt);
   if(j.status==='success' && j.data){
    log(`✅ Microlink OK - Foto: ${j.data.image?.url?'sim':'não'}`);
    return {finalUrl: j.data.url||shortUrl, title: j.data.title, image: j.data.image?.url, html: j.data.description||"", shop:null, item:null};
   }
  }
 }catch(e){}

 // 2. Tenta allorigins que segue redirecionamento
 try{
  let txt=await fetchWithTimeout(`https://api.allorigins.win/get?url=${encodeURIComponent(shortUrl)}`, 6000);
  if(txt){
   let j=JSON.parse(txt);
   let html=j.contents||"";
   let m=html.match(/https:\/\/shopee\.com\.br\/[^"'\s<>]+-i\.\d+\.\d+/);
   let finalUrl=m?m[0]:shortUrl;
   let ids=finalUrl.match(/-i\.(\d+)\.(\d+)/) || html.match(/-i\.(\d+)\.(\d+)/);
   let shop=ids?ids[1]:null, item=ids?ids[2]:null;
   if(shop) log(`✅ IDs encontrados: ${shop} ${item}`);
   return {finalUrl, title:null, image:null, html, shop, item};
  }
 }catch(e){}

 return {finalUrl: shortUrl, title:null, image:null, html:"", shop:null, item:null};
}

async function getProductData(shop, item, finalUrl, htmlBase){
 let precoAtual=null, precoAntes=null, title=null, image=null;
 let html=htmlBase||"";

 // Tenta API v4 via corsproxy que funciona no celular e no Vercel
 if(shop && item){
  log(`💰 Buscando preço Shop ${shop} Item ${item} via corsproxy...`);
  let apiUrl=`https://shopee.com.br/api/v4/item/get?itemid=${item}&shopid=${shop}`;
  let proxies=[
   `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`,
   `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`,
   `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(apiUrl)}`
  ];
  for(let p of proxies){
   let txt=await fetchWithTimeout(p, 6000);
   if(!txt) continue;
   try{
    let j=JSON.parse(txt);
    let data=j.data|| (j.contents?JSON.parse(j.contents).data:null);
    if(!data && j.contents){
     try{data=JSON.parse(j.contents).data;}catch(e){}
    }
    if(data){
     if(data.name) title=data.name;
     let imgFile=data.image||(data.images&&data.images[0]);
     if(imgFile) image=`https://down-br.img.susercontent.com/file/${imgFile}`;
     let pmin=data.price_min||data.price;
     let pbefore=data.price_min_before_discount||data.price_before_discount;
     if(pmin){
      let v=parseInt(pmin);
      precoAtual=v>=100000?v/100000:v>=1000?v/100:v;
     }
     if(pbefore){
      let v=parseInt(pbefore);
      precoAntes=v>=100000?v/100000:v>=1000?v/100:v;
     }
     if(precoAtual){log(`✅ Preço API: ${formatBRL(precoAtual)}`); break;}
    }
   }catch(e){
    // tenta extrair price_min do texto
    let mMin=txt.match(/"price_min"\s*:\s*(\d+)/);
    let mBefore=txt.match(/"price_min_before_discount"\s*:\s*(\d+)/);
    if(mMin){
     let v=parseInt(mMin[1]);
     precoAtual=v>=100000?v/100000:v>=1000?v/100:v;
     log(`✅ Preço extraído: ${formatBRL(precoAtual)}`);
    }
    if(mBefore){
     let v=parseInt(mBefore[1]);
     precoAntes=v>=100000?v/100000:v>=1000?v/100:v;
    }
    if(precoAtual) break;
   }
  }
 }

 // Fallback R$ do HTML
 if(!precoAtual && html){
  let matches=[...html.matchAll(/R\$\s*([\d\.\,]+)/g)];
  let vals=[];
  matches.forEach(m=>{
   let raw=m[1];
   let norm=raw.replace('.','').replace(',','.');
   if(raw.includes('.') && raw.includes(',')) norm=raw.replace('.','').replace(',','.');
   else if(raw.includes(',') && !raw.includes('.')) norm=raw.replace(',','.');
   let v=parseFloat(norm);
   if(!isNaN(v) && v>=10 && v<=50000) vals.push(v);
  });
  vals= [...new Set(vals)].sort((a,b)=>a-b);
  if(vals.length){precoAtual=vals[0]; let maiores=vals.filter(x=>x>precoAtual); if(maiores.length) precoAntes=Math.max(...maiores); log(`💵 R$ HTML: ${vals.slice(0,3).join(', ')}`);}
 }

 // OG tags
 if(html){
  let mt=html.match(/<meta property="og:title" content="([^"]+)"/);
  let mi=html.match(/<meta property="og:image" content="([^"]+)"/);
  if(mt && !title) title=mt[1];
  if(mi && !image) image=mi[1];
 }

 return {title, image, precoAtual, precoAntes};
}

document.getElementById('btn').onclick=async()=>{
 ORIGINAL=document.getElementById('aff').value.trim();
 if(!ORIGINAL){alert('Cole link');return;}
 document.getElementById('result').classList.remove('hidden');
 document.getElementById('log').innerHTML="";
 log(`Link fiel: ${ORIGINAL}`);
 log(`🔒 Nunca trocado`);

 let resolved=await resolveShopee(ORIGINAL);
 let finalUrl=resolved.finalUrl;
 let html=resolved.html||"";

 // tenta pegar mais html da página final
 if(finalUrl && finalUrl!==ORIGINAL){
  let txt=await fetchWithTimeout(`https://api.allorigins.win/get?url=${encodeURIComponent(finalUrl)}`, 6000);
  if(txt){
   try{let j=JSON.parse(txt); html+= "\n"+ (j.contents||"");}catch(e){html+= "\n"+txt;}
  }
 }

 let data=await getProductData(resolved.shop, resolved.item, finalUrl, html);
 let title=data.title||resolved.title||"Produto Shopee Verificado";
 let image=data.image||resolved.image;
 let precoAtual=data.precoAtual;
 let precoAntes=data.precoAntes;
 let desconto=0, economia=0;
 if(precoAntes && precoAtual && precoAntes>precoAtual){desconto=Math.round((1-precoAtual/precoAntes)*100); economia=precoAntes-precoAtual;}

 const fotoReal=document.getElementById('fotoReal');
 const fotoLoad=document.getElementById('fotoLoad');
 const overlay=document.getElementById('priceOverlay');

 if(image){
  fotoReal.src=`https://images.weserv.nl/?url=${encodeURIComponent(image)}&w=800&h=800&output=jpg`;
  fotoReal.onload=()=>{fotoLoad.classList.add('hidden');overlay.classList.remove('hidden');log(`✅ Foto carregada`);};
  fotoReal.onerror=()=>{fotoReal.src=image; fotoLoad.classList.add('hidden'); overlay.classList.remove('hidden');};
 }else{
  fotoLoad.innerHTML=`<div class="p-4 text-center"><p class="font-black">${title.slice(0,60)}</p><p class="text-[10px] mt-2">Foto não encontrada - link pode estar expirado, gere novo s.shopee</p></div>`;
  log(`⚠️ Sem foto - link ${ORIGINAL} pode estar expirado`);
 }

 document.getElementById('oTitle').textContent=title.slice(0,55);
 if(precoAtual){
  if(precoAntes && desconto>0) document.getElementById('oPrice').textContent=`DE ${formatBRL(precoAntes)} POR ${formatBRL(precoAtual)}`;
  else document.getElementById('oPrice').textContent=`${formatBRL(precoAtual)}`;
 }else{
  document.getElementById('oPrice').textContent=`Oferta no link`;
 }

 let blocoPreco="",blocoDesc="";
 if(precoAtual){
  if(precoAntes && desconto>0){blocoPreco=`💰 DE: ~${formatBRL(precoAntes)}~ POR: ${formatBRL(precoAtual)}`; blocoDesc=`🔥 ${desconto}% OFF - Economize ${formatBRL(economia)}!`;}
  else blocoPreco=`💰 POR APENAS: ${formatBRL(precoAtual)}`;
 }else{blocoPreco=`💰 OFERTA - Confira o preço no link!`; log(`❌ Shopee bloqueou valor, mas link funciona`);}

 const msg=`🚨 QUEIMA DE ESTOQUE SHOPEE 🚨

📦 ${title.toUpperCase()}

${blocoPreco}
${blocoDesc}

⚡ PRODUTO VERIFICADO - Estoque limitado!
👇 LINK COM DESCONTO ATIVO 👇

${ORIGINAL}

⏰ Corre antes que o preço volte!`;

 document.getElementById('msg').textContent=msg;
 document.getElementById('info').innerHTML=`<b>Valor:</b> ${precoAtual?formatBRL(precoAtual):'ver no link'} | <b>Antes:</b> ${precoAntes?formatBRL(precoAntes):'-'}<br><span class="text-green-700 font-bold">🔒 Link 100% fiel: ${ORIGINAL}</span><br><span class="text-[8px]">Tudo em 1 arquivo só • Sem backend • Vercel</span>`;
};

function copiar(){navigator.clipboard.writeText(document.getElementById('msg').textContent);alert('Copiado! Link fiel: '+ORIGINAL);}
function baixar(){const img=document.getElementById('fotoReal');if(img.src) window.open(img.src,'_blank');}
function whatsapp(){const txt=encodeURIComponent(document.getElementById('msg').textContent);window.open(`https://wa.me/?text=${txt}`,'_blank');}
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script>
