function extractIds(u){const m=u.match(/-i\.(\d+)\.(\d+)/);return m?{shop:m[1],item:m[2]}:null;}

async function fetchTimeout(url, ms=4000){
 const c=new AbortController();const to=setTimeout(()=>c.abort(),ms);
 try{const r=await fetch(url,{signal:c.signal});clearTimeout(to);if(!r.ok) return null;return await r.text();}catch(e){clearTimeout(to);return null;}
}

async function fetchParallelProxies(targetUrl){
 // 6 proxies em paralelo - pega primeiro que funcionar
 const proxies=[
  `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,
  `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
  `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
  `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
  `https://thingproxy.freeboard.io/fetch/${encodeURIComponent(targetUrl)}`,
  `https://api.cors.lol/?url=${encodeURIComponent(targetUrl)}`
 ];
 const promises=proxies.map(async p=>{
  const txt=await fetchTimeout(p, 3500);
  if(!txt) return null;
  // allorigins get retorna JSON com contents
  try{
   const j=JSON.parse(txt);
   if(j.contents) return j.contents;
   if(j.contents===undefined && txt.includes('shopee')) return txt;
  }catch(e){
   return txt;
  }
  return txt.includes('shopee') || txt.includes('price') || txt.includes('R$') ? txt : null;
 });
 const results=await Promise.allSettled(promises);
 for(let r of results){
  if(r.status==='fulfilled' && r.value && r.value.length>500){
   return r.value;
  }
 }
 // tenta pegar qualquer um
 for(let r of results){
  if(r.status==='fulfilled' && r.value) return r.value;
 }
 return null;
}

function extractAllPrices(html){
 let prices=[];
 let priceAmount=null;
 let priceMin=null;
 let priceBefore=null;
 let title=null;
 let image=null;
 if(!html) return {prices, priceAmount, priceMin, priceBefore, title, image};

 // titulo
 let mt=html.match(/<meta property="og:title" content="([^"]+)"/);
 if(mt) title=mt[1];
 if(!title){
  let mt2=html.match(/"name"\s*:\s*"([^"]{10,120})"/);
  if(mt2) title=mt2[1];
 }

 // imagem
 let mi=html.match(/<meta property="og:image" content="([^"]+)"/);
 if(mi) image=mi[1];

 // product:price:amount
 let pa=html.match(/<meta property="product:price:amount" content="([^"]+)"/);
 if(pa) priceAmount=parseFloat(pa[1]);

 // price_min em JSON
 let mins=[...html.matchAll(/"price_min"\s*:\s*(\d+)/g)];
 if(mins.length){
  let vals=mins.map(x=>parseInt(x[1]));
  priceMin=Math.max(...vals);
 }

 let befores=[...html.matchAll(/"price_min_before_discount"\s*:\s*(\d+)/g)];
 if(befores.length){
  let vals=befores.map(x=>parseInt(x[1]));
  priceBefore=Math.max(...vals);
 }

 // price antigo
 let pbs=[...html.matchAll(/"price_before_discount"\s*:\s*(\d+)/g)];
 if(!priceBefore && pbs.length){
  let vals=pbs.map(x=>parseInt(x[1]));
  priceBefore=Math.max(...vals);
 }

 // todos R$ no html
 let reais=[...html.matchAll(/R\$\s*([\d\.\,]+)/g)];
 let rs=[];
 reais.forEach(r=>{
  let raw=r[1];
  // remove pontos milhar, troca virgula por ponto
  let normalized=raw.replace(/\./g,'').replace(',','.');
  // caso tenha 2 pontos (ex 1.299.90 vira 1299.90)
  if((raw.match(/\./g)||[]).length>1){
   normalized=raw.replace(/\./g,'').replace(',','.');
  } else if(raw.includes('.') && raw.includes(',')){
   normalized=raw.replace(/\./g,'').replace(',','.');
  } else if(raw.includes(',') && !raw.includes('.')){
   normalized=raw.replace(',','.');
  }
  let val=parseFloat(normalized);
  if(!isNaN(val) && val>=5 && val<=50000){
   rs.push(val);
  }
 });

 // ordena e remove duplicados próximos
 rs.sort((a,b)=>a-b);
 let uniq=[];
 rs.forEach(v=>{
  if(!uniq.some(u=>Math.abs(u-v)<0.5)) uniq.push(v);
 });
 prices=uniq;

 return {prices, priceAmount, priceMin, priceBefore, title, image};
}

function toBRLFromShopeeInt(v){
 if(!v) return null;
 v=parseInt(v);
 if(v>=10000000) return v/100000;
 if(v>=100000) return v/100000;
 if(v>=1000) return v/100;
 return v;
}

function formatBRL(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}

async function resolveShortLink(shortUrl){
 if(cache[shortUrl]?.finalUrl){
  log(`⚡ Cache instantâneo`);
  return cache[shortUrl];
 }
 log(`🔍 Resolvendo ${shortUrl} em paralelo...`);
 let html=await fetchParallelProxies(shortUrl);
 if(!html){
  log(`⚠️ Não resolveu, usando link direto`);
  return {finalUrl:shortUrl, html:"", shop:null, item:null};
 }
 let finalMatch=html.match(/https:\/\/shopee\.com\.br\/[^"'\s<>]+-i\.\d+\.\d+/);
 let finalUrl=finalMatch?finalMatch[0]:shortUrl;
 let m=finalUrl.match(/-i\.(\d+)\.(\d+)/) || html.match(/-i\.(\d+)\.(\d+)/);
 let shop=null,item=null;
 if(m){shop=m[1];item=m[2];}
 log(`✅ Final: ${finalUrl.slice(0,60)}... Shop ${shop} Item ${item}`);
 let obj={finalUrl, html, shop, item};
 cache[shortUrl]=obj;
 localStorage.setItem('shopee_html_puro_v5', JSON.stringify(cache));
 return obj;
}

  let combined=(htmlLong||"")+"\n"+(htmlShort||"")+"\n"+(apiHtml||"");
  let extracted=extractAllPrices(combined);

  let titulo=extracted.title||"Produto Shopee Verificado";
  let imagem=extracted.image||null;
  let precoAtual=null, precoAntes=null;

  // tenta pegar de api html separado
  if(apiHtml){
   try{
    let j=JSON.parse(apiHtml);
    if(j.data){
     if(j.data.name) titulo=j.data.name;
     let imgFile=j.data.image||(j.data.images&&j.data.images[0]);
     if(imgFile) imagem=`https://down-br.img.susercontent.com/file/${imgFile}`;
     if(j.data.price_min) precoAtual=toBRLFromShopeeInt(j.data.price_min);
     if(j.data.price_min_before_discount) precoAntes=toBRLFromShopeeInt(j.data.price_min_before_discount);
     if(!precoAtual && j.data.price) precoAtual=toBRLFromShopeeInt(j.data.price);
     if(!precoAntes && j.data.price_before_discount) precoAntes=toBRLFromShopeeInt(j.data.price_before_discount);
    }
   }catch(e){
    // apiHtml pode ser html com price_min dentro
   }
  }

  // se ainda não tem, usa o que achou no html
  if(!precoAtual && extracted.priceAmount) precoAtual=extracted.priceAmount;
  if(!precoAtual && extracted.priceMin) precoAtual=toBRLFromShopeeInt(extracted.priceMin);
  if(!precoAntes && extracted.priceBefore) precoAntes=toBRLFromShopeeInt(extracted.priceBefore);

  // fallback R$ do html - pega menor como atual, maior como antes
  if((!precoAtual || precoAtual<5) && extracted.prices.length>0){
   precoAtual=extracted.prices[0];
   log(`💵 R$ encontrados: ${extracted.prices.slice(0,5).join(', ')}`);
  }
  if(!precoAntes && extracted.prices.length>1){
   let maiores=extracted.prices.filter(p=>p>precoAtual);
   if(maiores.length) precoAntes=Math.max(...maiores);
  }

  // se imagem ainda não tem e tem shop/item, tenta construir via API
  if(!imagem && shop && item){
   // tenta pegar imagem do htmlLong
   let mi=combined.match(/"image"\s*:\s*"([^"]+)"/);
   if(mi){
    let img=mi[1];

   }
  }

  if(precoAtual) log(`✅ Preço atual automático: ${formatBRL(precoAtual)}`);
  if(precoAntes) log(`✅ Preço antes: ${formatBRL(precoAntes)}`);
  if(!precoAtual) log(`⚠️ Shopee bloqueou preço, tentando outro proxy...`);

  let desconto=0, economia=0;

  // mostra foto

  const overlay=document.getElementById('priceOverlay');
  if(imagem){

   fotoReal.onload=()=>{fotoLoad.classList.add('hidden');overlay.classList.remove('hidden');};
   fotoReal.onerror=()=>{fotoReal.src=imagem;fotoLoad.classList.add('hidden');overlay.classList.remove('hidden');};
  }else{
   fotoLoad.innerHTML=`<div class="p-4 text-center"><p class="font-black text-[14px]">${titulo.slice(0,60)}</p><p class="text-[11px] text-gray-500 mt-1">Foto bloqueada mas valor automático ok</p></div>`;
  }
  document.getElementById('oTitle').textContent=titulo.slice(0,55);
  if(precoAtual){
   if(precoAntes && desconto>0){
    document.getElementById('oPrice').textContent=`DE ${formatBRL(precoAntes)} POR ${formatBRL(precoAtual)}`;
    document.getElementById('oDesc').textContent=`🔥 ${desconto}% OFF`;
   }else{
    document.getElementById('oPrice').textContent=`${formatBRL(precoAtual)}`;
   }
  }else{
   document.getElementById('oPrice').textContent=`Preço no link`;
  }

  // MENSAGEM SEM # E COM VALOR REAL AUTOMÁTICO
  let blocoPreco="",blocoDesc="";
  if(precoAtual){
   if(precoAntes && desconto>0){
    blocoPreco=`💰 DE: ~${formatBRL(precoAntes)}~ POR: ${formatBRL(precoAtual)}`;
    blocoDesc=`🔥 ${desconto}% OFF - Economize ${formatBRL(economia)}!`;
   }else{
    blocoPreco=`💰 POR APENAS: ${formatBRL(precoAtual)}`;
   }
  }else{
   blocoPreco=`💰 OFERTA IMPERDÍVEL`;
  }

  const msg=`🚨 QUEIMA DE ESTOQUE SHOPEE 🚨

📦 ${titulo.toUpperCase()}

${blocoPreco}
${blocoDesc}

⚡ PRODUTO VERIFICADO - Estoque limitado!
👇 LINK COM DESCONTO ATIVO 👇

${ORIGINAL}

⏰ Corre antes que o preço volte!`;

  document.getElementById('msg').textContent=msg;
  document.getElementById('info').innerHTML=`<b>Valor automático:</b> ${precoAtual?formatBRL(precoAtual):'não encontrado, Shopee bloqueou'} | <b>Antes:</b> ${precoAntes?formatBRL(precoAntes):'-'} | <b>Desconto:</b> ${desconto}%<br><span class="text-green-700 font-bold">🔒 Link 100% fiel: ${ORIGINAL}</span><br><span class="text-[9px] text-gray-500">HTML puro • Sem # • Valor 100% automático (sem digitar)</span>`;

 })();
