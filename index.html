<script>
const $aff=document.getElementById('aff');
let ORIGINAL="";
let cache=JSON.parse(localStorage.getItem('shopee_v6_cache')||'{}');

function log(t){const $log=document.getElementById('log');const d=document.createElement('div');d.textContent=new Date().toLocaleTimeString()+" → "+t;$log.appendChild(d);$log.scrollTop=$log.scrollHeight;}

function extractIds(u){const m=u.match(/-i\.(\d+)\.(\d+)/);return m?{shop:m[1],item:m[2]}:null;}

async function fetchTimeout(url, ms=5000){
 const c=new AbortController();const to=setTimeout(()=>c.abort(),ms);
 try{const r=await fetch(url,{signal:c.signal});clearTimeout(to);if(!r.ok) return null;return await r.text();}catch(e){clearTimeout(to);return null;}
}

async function fetchMicrolink(targetUrl){
 // Microlink é o truque do WhatsApp - pega preview com foto real mesmo quando Shopee bloqueia
 try{
  const api=`https://api.microlink.io/?url=${encodeURIComponent(targetUrl)}&meta=true&screenshot=false`;
  const txt=await fetchTimeout(api, 6000);
  if(!txt) return null;
  const j=JSON.parse(txt);
  if(j.status==='success' && j.data){
   return {
    title: j.data.title,
    description: j.data.description,
    image: j.data.image?.url,
    logo: j.data.logo?.url,
    finalUrl: j.data.url
   };
  }
 }catch(e){}
 return null;
}

async function fetchParallelProxies(targetUrl){
 const proxies=[
  `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,
  `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
  `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
  `https://thingproxy.freeboard.io/fetch/${encodeURIComponent(targetUrl)}`
 ];
 const promises=proxies.map(async p=>{
  const txt=await fetchTimeout(p, 4000);
  if(!txt) return null;
  try{
   const j=JSON.parse(txt);
   if(j.contents) return j.contents;
  }catch(e){
   return txt;
  }
  return txt;
 });
 const results=await Promise.allSettled(promises);
 for(let r of results){
  if(r.status==='fulfilled' && r.value && r.value.length>500) return r.value;
 }
 return null;
}

function extractPricesFromText(text){
 let prices=[];
 if(!text) return prices;
 let matches=[...text.matchAll(/R\$\s*([\d\.\,]+)/g)];
 matches.forEach(m=>{
  let raw=m[1];
  let normalized=raw.replace(/\./g,'').replace(',','.');
  // trata casos tipo 1.299,90
  if(raw.includes('.') && raw.includes(',')){
   normalized=raw.replace(/\./g,'').replace(',','.');
  } else if(raw.includes(',') && !raw.includes('.')){
   normalized=raw.replace(',','.');
  }
  let val=parseFloat(normalized);
  if(!isNaN(val) && val>=10 && val<=50000){
   prices.push(val);
  }
 });
 // remove duplicados próximos e ordena
 prices.sort((a,b)=>a-b);
 let uniq=[];
 prices.forEach(v=>{if(!uniq.some(u=>Math.abs(u-v)<1)) uniq.push(v);});
 return uniq;
}

function toBRLFromInt(v){
 if(!v) return null;
 v=parseInt(v);
 if(v>=10000000) return v/100000;
 if(v>=100000) return v/100000;
 if(v>=1000) return v/100;
 return v;
}

function formatBRL(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}

async function resolveShortLink(shortUrl){
 if(cache[shortUrl]?.finalUrl){
  log(`⚡ Cache instantâneo`);
  return cache[shortUrl];
 }
 log(`🔍 Resolvendo link curto via preview...`);

 // 1. Tenta Microlink primeiro (mais rápido e pega foto)
 let micro=await fetchMicrolink(shortUrl);
 let finalUrl=shortUrl;
 let html="";
 let title=null;
 let image=null;
 let shop=null,item=null;

 if(micro){
  if(micro.finalUrl) finalUrl=micro.finalUrl;
  if(micro.title) title=micro.title;
  if(micro.image) image=micro.image;
  log(`✅ Preview WhatsApp: ${title?title.slice(0,40):'ok'} | Foto: ${image?'sim':'não'}`);
 }

 // 2. Tenta pegar HTML via proxy para extrair IDs e preços
 let htmlProxies=await fetchParallelProxies(shortUrl);
 if(htmlProxies){
  html=htmlProxies;
  let m=html.match(/https:\/\/shopee\.com\.br\/[^"'\s<>]+-i\.\d+\.\d+/);
  if(m) finalUrl=m[0];
  let ids=finalUrl.match(/-i\.(\d+)\.(\d+)/) || html.match(/-i\.(\d+)\.(\d+)/);
  if(ids){shop=ids[1];item=ids[2];}
 }

 // 3. Se ainda não tem shop/item, tenta extrair do finalUrl
 if(!shop || !item){
  let m2=finalUrl.match(/-i\.(\d+)\.(\d+)/);
  if(m2){shop=m2[1];item=m2[2];}
 }

 let obj={finalUrl, html, title, image, shop, item};
 cache[shortUrl]=obj;
 localStorage.setItem('shopee_v6_cache', JSON.stringify(cache));
 return obj;
}

document.getElementById('btn').onclick=async()=>{
 ORIGINAL=$aff.value.trim();
 if(!ORIGINAL){alert('Cole seu s.shopee.com.br');return;}
 document.getElementById('result').classList.remove('hidden');
 document.getElementById('log').innerHTML="";
 log(`Link fiel: ${ORIGINAL}`);
 log(`🔒 Nunca será trocado - 100% fiel`);

 (async()=>{
  const resolved=await resolveShortLink(ORIGINAL);
  let finalUrl=resolved.finalUrl;
  let title=resolved.title||"Produto Shopee Verificado";
  let image=resolved.image||null;
  let shop=resolved.shop;
  let item=resolved.item;
  let html=resolved.html||"";

  // tenta pegar mais dados da página final
  if(finalUrl && finalUrl!==ORIGINAL){
   log(`📄 Buscando dados da página final...`);
   let microFinal=await fetchMicrolink(finalUrl);
   if(microFinal){
    if(microFinal.title) title=microFinal.title;
    if(microFinal.image) image=microFinal.image;
   }
   let htmlFinal=await fetchParallelProxies(finalUrl);
   if(htmlFinal) html+= "\n"+htmlFinal;
  }

  // tenta API v4 via proxy para preço e imagem real
  let precoAtual=null, precoAntes=null;
  let apiData=null;

  if(shop && item){
   log(`💰 Buscando preço real via API Shopee...`);
   let apiUrl=`https://shopee.com.br/api/v4/item/get?itemid=${item}&shopid=${shop}`;
   let apiHtml=await fetchParallelProxies(apiUrl);
   if(apiHtml){
    try{
     let j=JSON.parse(apiHtml);
     if(j.data){
      apiData=j.data;
      if(j.data.name) title=j.data.name;
      let imgFile=j.data.image||(j.data.images&&j.data.images[0]);
      if(imgFile) image=`https://down-br.img.susercontent.com/file/${imgFile}`;
      if(j.data.price_min) precoAtual=toBRLFromInt(j.data.price_min);
      if(j.data.price_min_before_discount) precoAntes=toBRLFromInt(j.data.price_min_before_discount);
      if(!precoAtual && j.data.price) precoAtual=toBRLFromInt(j.data.price);
      if(!precoAntes && j.data.price_before_discount) precoAntes=toBRLFromInt(j.data.price_before_discount);
      log(`✅ API preço: ${precoAtual?formatBRL(precoAtual):'N/A'}`);
     }
    }catch(e){
     // apiHtml pode conter price_min mesmo não sendo JSON puro
     let pm=e;
    }
   }
   // tenta também extrair price_min do texto da api mesmo se JSON falhar
   if(!precoAtual && apiHtml){
    let mMin=apiHtml.match(/"price_min"\s*:\s*(\d+)/);
    let mBefore=apiHtml.match(/"price_min_before_discount"\s*:\s*(\d+)/);
    if(mMin) precoAtual=toBRLFromInt(mMin[1]);
    if(mBefore) precoAntes=toBRLFromInt(mBefore[1]);
   }
  }

  // extrai R$ do html combinado como fallback
  let precosRS=extractPricesFromText(html);
  log(`💵 R$ encontrados no HTML: ${precosRS.slice(0,5).join(', ')||'nenhum'}`);

  if((!precoAtual || precoAtual<10) && precosRS.length>0){
   precoAtual=precosRS[0];
   log(`✅ Usando menor R$ do HTML: ${formatBRL(precoAtual)}`);
  }
  if(!precoAntes && precosRS.length>1){
   let maiores=precosRS.filter(p=>p>precoAtual);
   if(maiores.length){
    precoAntes=Math.max(...maiores);
    log(`✅ Preço antes: ${formatBRL(precoAntes)}`);
   }
  }

  // se ainda não tem imagem, tenta pegar do og:image do html
  if(!image && html){
   let mi=html.match(/<meta property="og:image" content="([^"]+)"/);
   if(mi) image=mi[1];
  }

  let desconto=0,economia=0;
  if(precoAntes && precoAtual && precoAntes>precoAtual){
   desconto=Math.round((1-precoAtual/precoAntes)*100);
   economia=precoAntes-precoAtual;
  }

  // mostra foto - AGORA COM TRUQUE MICROLINK QUE FUNCIONA
  const fotoReal=document.getElementById('fotoReal');
  const fotoLoad=document.getElementById('fotoLoad');
  const overlay=document.getElementById('priceOverlay');

  if(image){
   // usa weserv para contornar CORS
   fotoReal.src=`https://images.weserv.nl/?url=${encodeURIComponent(image)}&w=800&h=800&output=jpg`;
   fotoReal.onload=()=>{fotoLoad.classList.add('hidden');overlay.classList.remove('hidden');log(`✅ Foto carregada`);};
   fotoReal.onerror=()=>{
    // tenta direto sem proxy
    fotoReal.src=image;
    fotoReal.onload=()=>{fotoLoad.classList.add('hidden');overlay.classList.remove('hidden');log(`✅ Foto carregada direto`);};
    fotoReal.onerror=()=>{
     fotoLoad.innerHTML=`<div class="p-4 text-center"><p class="font-black text-[13px]">${title.slice(0,50)}</p><p class="text-[10px] text-gray-500 mt-2">Foto bloqueada, mas copiando link direto</p><p class="text-[8px] mt-2 break-all">${image.slice(0,60)}...</p></div>`;
     log(`⚠️ Foto bloqueada, mas link da foto: ${image.slice(0,50)}`);
    };
   };
  }else{
   fotoLoad.innerHTML=`<div class="p-4 text-center"><p class="font-black text-[13px]">${title.slice(0,50)}</p><p class="text-[10px] text-gray-500 mt-2">Buscando foto alternativa...</p></div>`;
   log(`⚠️ Sem foto, tentando novamente...`);
   // tenta microlink de novo
   let micro2=await fetchMicrolink(finalUrl||ORIGINAL);
   if(micro2 && micro2.image){
    fotoReal.src=micro2.image;
    fotoLoad.classList.add('hidden');
    overlay.classList.remove('hidden');
    image=micro2.image;
    log(`✅ Foto alternativa carregada via preview`);
   }
  }

  document.getElementById('oTitle').textContent=title.slice(0,55);
  if(precoAtual){
   if(precoAntes && desconto>0){
    document.getElementById('oPrice').textContent=`DE ${formatBRL(precoAntes)} POR ${formatBRL(precoAtual)}`;
    document.getElementById('oDesc').textContent=`🔥 ${desconto}% OFF`;
   }else{
    document.getElementById('oPrice').textContent=`${formatBRL(precoAtual)}`;
   }
  }else{
   document.getElementById('oPrice').textContent=`Oferta imperdível - ver no link`;
   log(`❌ Shopee bloqueou valor, mas mensagem ainda sai com link fiel`);
  }

  // MENSAGEM FINAL SEM # E COM VALOR REAL AUTOMÁTICO
  let blocoPreco="",blocoDesc="";
  if(precoAtual){
   if(precoAntes && desconto>0){
    blocoPreco=`💰 DE: ~${formatBRL(precoAntes)}~ POR: ${formatBRL(precoAtual)}`;
    blocoDesc=`🔥 ${desconto}% OFF - Economize ${formatBRL(economia)}!`;
   }else{
    blocoPreco=`💰 POR APENAS: ${formatBRL(precoAtual)}`;
   }
  }else{
   // se não conseguiu preço, não coloca "Oferta imperdível" genérico, coloca que preço está no link mas com valor real quando possível
   blocoPreco=`💰 OFERTA - Confira o preço no link!`;
  }

  const msg=`🚨 QUEIMA DE ESTOQUE SHOPEE 🚨

📦 ${title.toUpperCase()}

${blocoPreco}
${blocoDesc}

⚡ PRODUTO VERIFICADO - Estoque limitado!
👇 LINK COM DESCONTO ATIVO 👇

${ORIGINAL}

⏰ Corre antes que o preço volte!`;

  document.getElementById('msg').textContent=msg;
  document.getElementById('info').innerHTML=`<b>Valor automático:</b> ${precoAtual?formatBRL(precoAtual):'Shopee bloqueou, mas link funciona'} | <b>Antes:</b> ${precoAntes?formatBRL(precoAntes):'-'} | <b>Desconto:</b> ${desconto}%<br><span class="text-green-700 font-bold">🔒 Link 100% fiel: ${ORIGINAL}</span><br><span class="text-[9px] text-gray-500">HTML puro V6 • Sem # • Foto via preview WhatsApp • Valor automático</span>`;

  // salva cache com preço
  cache[ORIGINAL]={finalUrl, title, image, shop, item, precoAtual, precoAntes, desconto};
  localStorage.setItem('shopee_v6_cache', JSON.stringify(cache));

 })();
};

function copiar(){navigator.clipboard.writeText(document.getElementById('msg').textContent);alert('Copiado com valor automático! Link fiel: '+ORIGINAL);}
function baixar(){const img=document.getElementById('fotoReal');if(img && img.src){const a=document.createElement('a');a.href=img.src;a.download=`produto-${Date.now()}.jpg`;a.target='_blank';a.click();}else{alert('Foto ainda carregando');}}
function whatsapp(){const txt=encodeURIComponent(document.getElementById('msg').textContent);window.open(`https://wa.me/?text=${txt}`,'_blank');}
