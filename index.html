<script>
const $aff=document.getElementById('aff');
const $log=document.getElementById('log');
const $lockBox=document.getElementById('lockBox');
const $lockTxt=document.getElementById('lockTxt');
let ORIGINAL_LINK="";
let DADOS={};

function log(t){const d=document.createElement('div');d.textContent=new Date().toLocaleTimeString()+" → "+t;$log.appendChild(d);$log.scrollTop=$log.scrollHeight;}

$aff.addEventListener('input',()=>{if($aff.value){$lockBox.classList.remove('hidden');$lockTxt.textContent=$aff.value;}});

function extractIds(u){const m=u.match(/-i\.(\d+)\.(\d+)/);return m?{shop:m[1],item:m[2]}:null;}
async function viaProxies(url){
 const ps=[`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,`https://corsproxy.io/?${encodeURIComponent(url)}`,`https://thingproxy.freeboard.io/fetch/${encodeURIComponent(url)}`];
 for(let p of ps){try{const r=await fetch(p);if(!r.ok) continue;const t=await r.text();if(t.length>300) return t;}catch(e){}}
 return null;
}

function formatBRL(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}

function parseShopeePrice(apiData){
 // Shopee API: price_min / 100000 = BRL
 try{
  const priceMin = apiData.price_min ? apiData.price_min/100000 : (apiData.price ? apiData.price/100000 : null);
  const priceBefore = apiData.price_min_before_discount ? apiData.price_min_before_discount/100000 : (apiData.price_before_discount ? apiData.price_before_discount/100000 : null);
  const priceMax = apiData.price_max ? apiData.price_max/100000 : null;
  
  let descontoPct=0;
  let economia=0;
  if(priceBefore && priceMin && priceBefore>priceMin){
   descontoPct=Math.round((1-priceMin/priceBefore)*100);
   economia=priceBefore-priceMin;
  }
  return {atual:priceMin, antes:priceBefore, max:priceMax, descontoPct, economia};
 }catch(e){return {atual:null,antes:null,descontoPct:0,economia:0};}
}

async function buscarCupons(shopId, itemId){
 // tenta buscar vouchers da loja/produto
 const urls=[
  `https://shopee.com.br/api/v4/voucher/get_shop_vouchers?shopid=${shopId}`,
  `https://shopee.com.br/api/v4/pdp/get_vouchers?item_id=${itemId}&shop_id=${shopId}`,
  `https://shopee.com.br/api/v4/voucher/get_product_vouchers?item_id=${itemId}&shop_id=${shopId}`
 ];
 for(let url of urls){
  const txt=await viaProxies(url);
  if(!txt) continue;
  try{
   const j=JSON.parse(txt);
   const vouchers=j.data?.shop_vouchers || j.data?.vouchers || j.data?.product_vouchers || j.data;
   if(Array.isArray(vouchers) && vouchers.length>0){
    // pega melhor cupom
    const melhor=vouchers[0];
    return {tem:true, qtd:vouchers.length, detalhe:melhor};
   }
   if(j.data && typeof j.data==='object' && Object.keys(j.data).length>0){
    // algum cupom genérico
    return {tem:true, qtd:1, detalhe:j.data};
   }
  }catch(e){}
 }
 return {tem:false};
}

document.getElementById('btn').onclick=async()=>{
 ORIGINAL_LINK=$aff.value.trim();
 if(!ORIGINAL_LINK){alert('Cole seu s.shopee.com.br');return;}
 $lockBox.classList.remove('hidden');
 $lockTxt.textContent=ORIGINAL_LINK;
 $log.innerHTML="";
 document.getElementById('result').classList.add('hidden');
 log(`Link ORIGINAL do usuário: ${ORIGINAL_LINK}`);
 log(`🔒 REGRA: Esse link será mantido 100% fiel, sem troca`);
 log(`APP_ID: ${SHOPEE_APP_ID}`);

 let finalUrl=ORIGINAL_LINK;
 let ids=null;

 // 1. Resolver s.shopee para longa
 log(`Resolvendo link curto...`);
 const html=await viaProxies(ORIGINAL_LINK);
 if(html){
  const m=html.match(/https:\/\/shopee\.com\.br\/[^"'\s<>]+-i\.\d+\.\d+/);
  if(m){finalUrl=m[0];log(`✅ URL longa: ${finalUrl.slice(0,65)}...`);}
  const m2=finalUrl.match(/-i\.(\d+)\.(\d+)/) || html.match(/-i\.(\d+)\.(\d+)/);
  if(m2){ids={shop:m2[1],item:m2[2]};log(`✅ Shop ${m2[1]} Item ${m2[2]}`);}
 }

 let titulo="Produto Shopee", imagem=null;
 let precoInfo={atual:null,antes:null,descontoPct:0,economia:0};
 let cupomInfo={tem:false};

 // 2. OG tags fallback
 if(finalUrl){
  const h2=await viaProxies(finalUrl);
  if(h2){
   const mt=h2.match(/<meta property="og:title" content="([^"]+)"/);
   const mi=h2.match(/<meta property="og:image" content="([^"]+)"/);
   const mp=h2.match(/<meta property="product:price:amount" content="([^"]+)"/);
   if(mt) titulo=mt[1];
   if(mi) imagem=mi[1];
   if(mp && !precoInfo.atual){precoInfo.atual=parseFloat(mp[1]);}
  }
 }

 // 3. API pública v4 para preço real e cupom
 if(ids){
  const apiUrl=`https://shopee.com.br/api/v4/item/get?itemid=${ids.item}&shopid=${ids.shop}`;
  log(`Buscando preço real e descontos...`);
  const apiTxt=await viaProxies(apiUrl);
  if(apiTxt){
   try{
    const j=JSON.parse(apiTxt);
    if(j.data){
     titulo=j.data.name||titulo;
     const imgFile=j.data.image||(j.data.images&&j.data.images[0]);
     if(imgFile) imagem=`https://down-br.img.susercontent.com/file/${imgFile}`;
     precoInfo=parseShopeePrice(j.data);
     log(`✅ Preço atual: ${precoInfo.atual?formatBRL(precoInfo.atual):'N/A'}`);
     if(precoInfo.antes) log(`✅ Preço antes: ${formatBRL(precoInfo.antes)} (${precoInfo.descontoPct}% OFF)`);
     DADOS.apiRaw=j.data;
    }
   }catch(e){log(`API v4 bloqueada, usando OG`);}
  }

  // 4. Cupons
  log(`Verificando cupons disponíveis...`);
  cupomInfo=await buscarCupons(ids.shop, ids.item);
  if(cupomInfo.tem){
   log(`🎟️ CUPOM ENCONTRADO: ${cupomInfo.qtd} cupom(s) disponível`);
   document.getElementById('cupomBadge').classList.remove('hidden');
   document.getElementById('cupomBadge').textContent=`🎟️ ${cupomInfo.qtd} CUPOM`;
  }else{
   log(`Sem cupom público no momento`);
  }
 }

 // 5. Monta mensagem CHAMATIVA sem alterar link
 let blocoPreco="";
 let blocoDesconto="";
 let blocoCupom="";

 if(precoInfo.atual){
  if(precoInfo.antes && precoInfo.descontoPct>0){
   blocoPreco=`💰 *DE:* ~${formatBRL(precoInfo.antes)}~ *POR:* ${formatBRL(precoInfo.atual)}`;
   blocoDesconto=`🔥 *${precoInfo.descontoPct}% OFF* - Você economiza ${formatBRL(precoInfo.economia)}!`;
  }else{
   blocoPreco=`💰 *POR APENAS:* ${formatBRL(precoInfo.atual)}`;
  }
 }else{
  blocoPreco=`💰 *Preço imperdível na Shopee*`;
 }

 if(cupomInfo.tem){
  blocoCupom=`🎟️ *CUPOM DISPONÍVEL NA LOJA!* Aplique na hora da compra e ganhe MAIS desconto!`;
 }

 // Mensagem chamativa
 const msg=`🚨 *QUEIMA DE ESTOQUE SHOPEE* 🚨

📦 *${titulo.toUpperCase()}*

${blocoPreco}
${blocoDesconto}

${blocoCupom}

⚡ *PRODUTO VERIFICADO* - Estoque limitado!
👇 *LINK COM DESCONTO ATIVO* 👇

${ORIGINAL_LINK}

⏰ Corre antes que o preço volte!

#achadinhos #shopee #promoção #ofertaimperdível #achadinho`;

 document.getElementById('msg').textContent=msg;
 document.getElementById('infoPreco').innerHTML=`Preço real: ${precoInfo.atual?formatBRL(precoInfo.atual):'consulte no link'} | Desconto: ${precoInfo.descontoPct}% | Cupom: ${cupomInfo.tem?'SIM '+cupomInfo.qtd:'não encontrado'}<br><span class="text-green-400">🔒 Link mantido 100% fiel: ${ORIGINAL_LINK}</span>`;
 document.getElementById('result').classList.remove('hidden');

 // Gera arte com preço
 const canvas=document.getElementById('canvas');
 const ctx=canvas.getContext('2d');
 ctx.fillStyle="#000";
 ctx.fillRect(0,0,1080,1350);

 const drawOverlay=()=>{
  // faixa gradiente embaixo
  const grad=ctx.createLinearGradient(0,1020,0,1350);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(0.2,'rgba(0,0,0,0.9)');
  grad.addColorStop(1,'rgba(0,0,0,1)');
  ctx.fillStyle=grad;
  ctx.fillRect(0,1020,1080,330);

  // badge desconto
  if(precoInfo.descontoPct>0){
   ctx.fillStyle="#FF0000";
   ctx.beginPath();
   ctx.roundRect(30,30,200,80,20);
   ctx.fill();
   ctx.fillStyle="#fff";
   ctx.font="bold 48px Inter";
   ctx.fillText(`-${precoInfo.descontoPct}%`,50,85);
  }

  // badge cupom
  if(cupomInfo.tem){
   ctx.fillStyle="#FFD700";
   ctx.beginPath();
   ctx.roundRect(30, precoInfo.descontoPct>0?120:30, 320, 60, 15);
   ctx.fill();
   ctx.fillStyle="#000";
   ctx.font="bold 28px Inter";
   ctx.fillText(`🎟️ CUPOM DISPONÍVEL!`,45,(precoInfo.descontoPct>0?120:30)+38);
  }

  ctx.fillStyle="#fff";
  ctx.font="bold 34px Inter";
  const linhas=titulo.match(/.{1,36}(\s|$)/g)||[titulo];
  linhas.slice(0,2).forEach((l,i)=>ctx.fillText(l.trim(),30,1090+i*40,1020));

  // preço na arte
  ctx.font="bold 42px Inter";
  if(precoInfo.atual){
   if(precoInfo.antes && precoInfo.descontoPct>0){
    ctx.fillStyle="#888";
    ctx.font="24px Inter";
    ctx.fillText(`DE ${formatBRL(precoInfo.antes)}`,30,1170);
    ctx.fillStyle="#00FF88";
    ctx.font="bold 46px Inter";
    ctx.fillText(`POR ${formatBRL(precoInfo.atual)}`,30,1220);
   }else{
    ctx.fillStyle="#00FF88";
    ctx.fillText(`${formatBRL(precoInfo.atual)}`,30,1220);
   }
  }

  ctx.fillStyle="#ff6a00";
  ctx.font="bold 22px Inter";
  ctx.fillText(`LINK 100% FIEL NA LEGENDA 👇`,30,1290);
 };

 if(imagem){
  const img=document.getElementById('imgCache');
  img.crossOrigin="anonymous";
  img.src="https://images.weserv.nl/?url="+encodeURIComponent(imagem)+"&w=1080&h=1080&fit=cover";
  img.onload=()=>{ctx.drawImage(img,0,0,1080,1080);drawOverlay();log(`🎨 Arte com preço real gerada`);};
  img.onerror=()=>{drawOverlay();};
 }else{
  drawOverlay();
 }

};

function copiar(){navigator.clipboard.writeText(document.getElementById('msg').textContent);alert('Mensagem chamativa copiada! Link 100% fiel: '+ORIGINAL_LINK);}
function baixar(){const c=document.getElementById('canvas');const a=document.createElement('a');a.download=`achadinho-chamativo-${Date.now()}.png`;a.href=c.toDataURL();a.click();}
function whatsapp(){
 const txt=encodeURIComponent(document.getElementById('msg').textContent);
 window.open(`https://wa.me/?text=${txt}`,'_blank');
 log(`🔒 Enviando pro Zap com link fiel: ${ORIGINAL_LINK}`);
}
</script>
